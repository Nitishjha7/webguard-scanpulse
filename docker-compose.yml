name: webguard

services:
  postgres:
    image: postgres:16-alpine
    container_name: webguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webguard}
      POSTGRES_DB: ${POSTGRES_DB:-webguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webguard} -d ${POSTGRES_DB:-webguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: webguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: webguard-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-webguard}:${POSTGRES_PASSWORD:-webguard}@postgres:5432/${POSTGRES_DB:-webguard}
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Live reload during development; drop this line for a production image.
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: celery_worker/Dockerfile
    image: webguard-worker
    container_name: webguard-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-webguard}:${POSTGRES_PASSWORD:-webguard}@postgres:5432/${POSTGRES_DB:-webguard}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["celery", "-A", "celery_main:celery", "worker", "--loglevel=info", "--queues=probes,scans", "--concurrency=4"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_main:celery inspect ping | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  beat:
    build:
      context: .
      dockerfile: celery_worker/Dockerfile
    image: webguard-worker
    container_name: webguard-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-webguard}:${POSTGRES_PASSWORD:-webguard}@postgres:5432/${POSTGRES_DB:-webguard}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - beat_state:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Exactly one beat process may run, or every schedule fires twice.
    command: ["celery", "-A", "celery_main:celery", "beat", "--loglevel=info", "--schedule=/var/lib/celery/beat-schedule"]

volumes:
  postgres_data:
  redis_data:
  beat_state:
