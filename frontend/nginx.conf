server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed filenames, so these can be cached hard and for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API and the public status pages live on the backend. Proxying them
    # through here keeps the browser on one origin, so no CORS preflight.
    location /api/    { proxy_pass http://backend:5000; include /etc/nginx/proxy_params_wg; }
    location /status  { proxy_pass http://backend:5000; include /etc/nginx/proxy_params_wg; }
    location /health/ { proxy_pass http://backend:5000; include /etc/nginx/proxy_params_wg; }

    # Client-side routing: every unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves browsers loading
    # asset URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
